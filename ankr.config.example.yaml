# ankr.config.yaml — ANKR canonical configuration
#
# Generated by `ankr init`. Edit by hand or re-run `ankr init --repair`.
# This file lives in your PROJECT ROOT. ANKR walks up from cwd to find it.
#
# Environment variables: `${VAR}` is expanded via os.environ at load time.
# Use this to keep machine-specific paths out of version control.

ankr_version: "0.1.0"

project:
  name: my-houdini-project        # arbitrary label; defaults to project.root basename
  root: ${ANKR_PROJECT_ROOT}      # MUST be absolute after expansion

docs:
  root: docs/ankr                 # relative => resolved against project.root
  hip_subdir: ""                  # "" = hip endnodes live at <docs.root>/<hipname>/<endnode>/ (legacy ANKR layout)
  hda_subdir: custom_hda
  deadflow_reports_subdir: deadflow_reports
  logs_subdir: logs

houdini:
  install_root: null              # null = auto-detect via HFS env var (best effort)
  user_libs_dir: null             # null = derive from OS user prefs + version_hint
  version_hint: null              # informational ONLY; e.g. "21.0". Never used as a path literal.

hda_search_paths: []              # additional .hda dirs (absolute or relative-to-project.root)

logging:
  dir: logs/ankr                  # relative => resolved against project.root
  level: INFO                     # DEBUG | INFO | WARNING | ERROR

rule_store:                       # OPTIONAL — Phase 3 `promote-check` integration
  kind: null                      # null => NullRuleStore (no-op). Set to an adapter name to wire one.
  config: {}                      # adapter-specific opaque dict

hooks:                            # Phase 2 feature flags
  enable_drift_reminder: true
  enable_session_end_check: true
